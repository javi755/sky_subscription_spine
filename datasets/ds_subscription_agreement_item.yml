unique_name: ds_subscription_agreement_item
object_type: dataset
label: dim_subscription_agreement_item
connection_id: con_cust_spine_subs
description: Agreement (contract) items per subscription, including minimum term.
table: dim_subscription_agreement_item
columns:
- name: id
  data_type: string
- name: subscription_id
  data_type: string
- name: dw_last_modified_dt
  data_type: datetime
- name: created_dt
  data_type: datetime
- name: created_by_id
  data_type: string
- name: last_modified_dt
  data_type: datetime
- name: last_modified_by_id
  data_type: string
- name: start_dt
  data_type: datetime
- name: end_dt
  data_type: datetime
- name: agreement_item_type
  data_type: string
- name: calculated_minimum_term_end_dt
  data_type: datetime
- name: minimum_term_months
  data_type: long
- name: registered_dt
  data_type: datetime
- name: subscription_agreement_id
  data_type: string
- name: subscription_agreement
  data_type: string
- name: created_reason_code
  data_type: string
- name: contract_code
  data_type: string
- name: order_id
  data_type: string
- name: dmcc_flag
  data_type: boolean
- name: trigger_offer_id
  data_type: string
- name: parent_contract_number
  data_type: long
- name: created_date
  data_type: date
  sql: DATE(created_dt)
- name: agreement_start_date
  data_type: date
  sql: DATE(start_dt)
- name: minimum_term_end_date
  data_type: date
  sql: DATE(calculated_minimum_term_end_dt)
- name: agreement_item_type_name
  data_type: string
  sql: COALESCE(agreement_item_type, 'Unknown')
- name: subscription_agreement_name
  data_type: string
  sql: COALESCE(subscription_agreement, 'Unknown')
- name: created_reason_code_name
  data_type: string
  sql: COALESCE(created_reason_code, 'None')
- name: dmcc_flag_name
  data_type: string
  sql: CASE WHEN dmcc_flag THEN 'DMCC' WHEN NOT dmcc_flag THEN 'Not DMCC' ELSE 'Unknown' END
- name: dmcc_int
  data_type: long
  sql: CASE WHEN dmcc_flag THEN 1 ELSE 0 END
- name: minimum_term_status
  data_type: string
  sql: CASE WHEN calculated_minimum_term_end_dt IS NULL THEN 'No Minimum Term' WHEN calculated_minimum_term_end_dt > CURRENT_TIMESTAMP() THEN 'In Minimum Term' ELSE 'Out of Minimum Term' END
- name: in_minimum_term_int
  data_type: long
  sql: CASE WHEN calculated_minimum_term_end_dt > CURRENT_TIMESTAMP() THEN 1 ELSE 0 END
