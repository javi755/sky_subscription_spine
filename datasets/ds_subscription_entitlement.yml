unique_name: ds_subscription_entitlement
object_type: dataset
label: dim_subscription_entitlement
connection_id: con_cust_spine_subs
description: 'Entitlement history (SCD2) per subscription: one row per entitlement interval.'
table: dim_subscription_entitlement
columns:
- name: id
  data_type: string
- name: subscription_id
  data_type: string
- name: dw_created_dt
  data_type: datetime
- name: dw_last_modified_dt
  data_type: datetime
- name: effective_from_dt
  data_type: datetime
- name: effective_from_dt_csn_seq
  data_type: decimal(38,9)
- name: effective_from_dt_seq
  data_type: decimal(38,9)
- name: effective_to_dt
  data_type: datetime
- name: created_dt
  data_type: datetime
- name: created_by_id
  data_type: string
- name: last_modified_dt
  data_type: datetime
- name: last_modified_by_id
  data_type: string
- name: entitlement_id
  data_type: string
- name: entitlement_code
  data_type: string
- name: entitlement
  data_type: string
- name: effective_from_date
  data_type: date
  sql: DATE(effective_from_dt)
- name: is_current_int
  data_type: long
  sql: CASE WHEN CURRENT_TIMESTAMP() >= effective_from_dt AND CURRENT_TIMESTAMP() < effective_to_dt THEN 1 ELSE 0 END
- name: record_currency
  data_type: string
  sql: CASE WHEN CURRENT_TIMESTAMP() >= effective_from_dt AND CURRENT_TIMESTAMP() < effective_to_dt THEN 'Current' ELSE 'Historical' END
